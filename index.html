<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#03050D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<title>D-Riv 3D Metallerie</title>
<style>
:root{
  --bgfill:#05091A;
  --bggrad:linear-gradient(165deg,#03050D 0%,#0A1A4F 55%,#1C4DB3 100%);
  --head:rgba(3,5,13,.72);
  --card:rgba(255,255,255,.07);
  --card2:rgba(255,255,255,.04);
  --solid:#0E1838;
  --line:rgba(255,255,255,.15);
  --ink:#F2F5FF;
  --soft:#A3B3D9;
  --accent:#FF8C21;
  --accent-ink:#1A0E02;
  --royal:#4C80F5;
  --input:rgba(0,0,0,.30);
  --danger:#FF7070;
  --ok:#3DD68C;
  --off:rgba(255,255,255,.35);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bgfill:#F2F4F9;
  --bggrad:linear-gradient(#F2F4F9,#F2F4F9);
  --head:linear-gradient(120deg,#060B22,#0D2C82 60%,#1F55C8);
  --card:#FFFFFF;
  --card2:#F7F8FC;
  --solid:#FFFFFF;
  --line:#DDE2EC;
  --ink:#121A33;
  --soft:#66708A;
  --accent:#E8730C;
  --accent-ink:#FFFFFF;
  --royal:#1F55C8;
  --input:#F5F7FB;
  --danger:#D64545;
  --ok:#17A673;
  --off:#9AA3B8;
  --shadow:0 10px 30px rgba(10,20,50,.15);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bgfill);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;min-height:100vh;padding-bottom:110px}
body::before{content:"";position:fixed;inset:0;background:var(--bggrad);z-index:-1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
select{padding-right:6px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
textarea{resize:vertical;min-height:40px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* header */
header.top{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;padding:10px 16px 0;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.12)}
.top-in{max-width:1000px;margin:0 auto}
.top-row{display:flex;align-items:center;gap:12px}
.top-row img{height:30px;display:block}
.top-row .v2{background:#FF8C21;color:#1A0E02;font-weight:800;font-size:.7rem;padding:2px 7px;border-radius:6px}
.top-row .sub{font-size:.72rem;color:#AFC0EA;letter-spacing:.06em;text-transform:uppercase;flex:1;min-width:0}
.savestate{font-size:.72rem;color:#AFC0EA;white-space:nowrap}
.iconbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:6px 10px;font-size:.95rem;line-height:1}
nav.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;white-space:nowrap;background:none;border:none;color:#C9D4F2;padding:10px 6px 11px;font-weight:700;font-size:.92rem;border-bottom:3px solid transparent}
nav.tabs button.on{color:#fff;border-bottom-color:#FF8C21}
.menu{position:absolute;right:16px;top:52px;background:var(--solid);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;min-width:240px;z-index:30}
.menu button{background:none;border:none;text-align:left;padding:10px 12px;border-radius:8px}
.menu button:hover{background:var(--card2)}

main{max-width:1000px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.srow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .lab{flex:1;min-width:0}
.srow .lab small{display:block;color:var(--soft);font-size:.8rem;margin-top:2px}
.srow input{width:84px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.srow .u{width:58px;flex:none;color:var(--soft);font-size:.82rem}
details.sdet{border-top:1px solid var(--line)}
details.sdet:first-of-type{border-top:none}
details.sdet>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:12px 0;font-weight:700}
details.sdet>summary::-webkit-details-marker{display:none}
details.sdet>summary::after{content:"›";margin-left:auto;color:var(--soft);font-size:1.3rem;transition:transform .15s}
details.sdet[open]>summary::after{transform:rotate(90deg)}
details.sdet>summary small{font-weight:400;color:var(--soft)}
.sdet .in{padding:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{margin:0 0 10px;font-size:1.02rem}
.card h3{margin:0;font-size:.95rem}
.muted{color:var(--soft)}
.small{font-size:.8rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.grid .wide{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:10px 14px;font-weight:600;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--royal);border-color:var(--royal);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:.85rem}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.btn:active{transform:scale(.98)}

/* D-Riv 3D Metallerie */
.top-row img.logo{height:26px;filter:invert(1)}
@media (max-width:560px){.top-row .sub{display:none}.top-row .savestate{flex:1;text-align:right}}
.ouv-head select{flex:1 1 160px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft)}
.kpi .v{font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums}
.kpi.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi.on .v{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:7px 12px;font-size:.88rem;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill{display:inline-block;font-size:.72rem;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.s0{color:var(--soft)}.pill.s1{color:var(--royal)}.pill.s2{color:var(--accent)}.pill.s3{color:var(--ok)}.pill.s4{color:var(--ok);border-color:var(--ok)}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;width:100%}
.pitem .n{flex:1;min-width:0}
.pitem .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem .p{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.phase{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.phase:last-child{border-bottom:none}
.phase .t{font-variant-numeric:tabular-nums;color:var(--soft);font-size:.88rem;text-align:right}
.btn.run{background:var(--ok);border-color:var(--ok);color:#04160D}
.big-clock{font-size:2rem;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ok)}
.hint{font-size:.8rem;color:var(--soft);background:var(--card2);border:1px dashed var(--line);border-radius:8px;padding:7px 10px}
.warn{color:var(--accent);font-weight:700}
.okc{color:var(--ok);font-weight:700}
.bad{color:var(--danger);font-weight:700}
.cx{display:flex;gap:6px}
.cx button{flex:1;border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:9px 0;font-weight:800}
.cx button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--head);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,.12);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar-in{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar-in .tot{flex:1;min-width:0;font-variant-numeric:tabular-nums}
.bar-in .tot b{font-size:1.2rem;color:#FF8C21}
.bar-in .tot span{display:block;font-size:.75rem;color:#AFC0EA}
</style>
</head>

  }, 250);
}
const S = k => (DB.settings[k]===undefined || DB.settings[k]===null || DB.settings[k]==="") ? SET_DEF[k] : DB.settings[k];
function T(type){ // type d'ouvrage avec les réglages de l'utilisateur
  const b = TYPES[type], o = (S("typesM")||{})[type] || {};
  return { label:b.label, aide:b.aide, base: num(o.base, b.base), eurT: num(o.eurT, b.eurT), prem: b.prem === undefined ? null : num(o.prem, b.prem), premLab:b.premLab, copieLab:b.copieLab,
           f: b.f.map(([k,l,u,h]) => [k,l,u, num(o.h && o.h[k], h)]) };
}
function num(v, def){ if(v===undefined || v===null || v==="") return def===undefined?0:def; const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? (def===undefined?0:def) : n; }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fE = n => (Math.round(n)).toLocaleString("fr-FR")+" €";
const fH = n => (Math.round(n*10)/10).toLocaleString("fr-FR")+" h";
const fN = (n,d=1) => (Math.round(n*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("fr-FR");
const today = () => new Date().toISOString().slice(0,10);
const cur = () => DB.projets.find(p => p.id === DB.cur);

/* ================= Calcul ================= */
function calc(p){
  const cx = S("cx")[(p.cx||3)-1] || 1, coef = num(S("coefPlans"), 1);
  let hBrut = 0, kg = 0, prixT = 0;
  const lignes = p.ouvrages.map(o => {
    const t = T(o.type);
    let h = t.base; t.f.forEach(([k,,,hu], i) => { const n = num(o.q[k]); h += (i === 0 && t.prem !== null && n > 0) ? t.prem + (n - 1) * hu : n * hu; });
    const okg = num(o.kg);
    kg += okg; prixT += okg/1000 * t.eurT; hBrut += h;
    return {o, t, h, kg:okg, prixT: okg/1000*t.eurT};
  });
  const ph = p.phases || {}, hMod = hBrut * cx;
  const phases = [{k:"mod", l:PARTS[0][1], on: ph.mod !== undefined ? ph.mod !== false : ph.ens !== false, h: hMod},
                  {k:"plans", l:PARTS[1][1], on: ph.plans !== undefined ? ph.plans !== false : (ph.fab !== false || ph.nom !== false || ph.mont !== false), h: hMod * coef}];
  const hEst = phases.reduce((s,x) => s + (x.on ? x.h : 0), 0);
  const taux = num(p.taux, S("taux"));
  const prixH = hEst * taux;
  const hRevis = (p.revisions||[]).reduce((s,r) => s + num(r.h), 0);
  const prixRev = hRevis * taux;
  const mode = p.mode || (p.client === "romain" ? "tonne" : "heures");
  const prix = (mode === "tonne" && kg > 0 ? prixT : prixH);
  const sec = PHASES.reduce((s,[k]) => s + num((p.chrono||{})[k]), 0) + (p.run ? (Date.now()-p.run.start)/1000 : 0);
  const hReel = sec/3600;
  return {lignes, hBrut, cx, phases, hEst, taux, prixH, prixT, kg, mode, prix, total: prix + prixRev, hRevis, prixRev, hReel,
          eurKg: kg>0 ? prix/kg : 0, hParT: kg>0 ? hEst/(kg/1000) : 0, eurTEquiv: kg>0 ? prixH/(kg/1000) : 0};
}

/* ================= Import depuis Endgo ================= */
function ouvFromEndgo(x){
  const q = x.q || {}, n = num(q.nbPortiques), tr = Math.max(0, n-1), kg = x.kg ? String(x.kg) : "";
  const nom = x.name + (x.variant ? " (option " + x.variant + ")" : "");
  const mk = (type, qq) => ({id:uid(), type, q:qq, kg, nom, src:x.typeLabel});
  const hv = (x.hauvents||[]).length, ouvT = new Set((x.ouvertures||[]).map(o => o.type)).size;
  switch(x.type){
    case "complet": case "ossature": case "oss_bard": case "oss_couv": {
      const lissesPignon = num(q.nbLignesLisses) * 2 * Math.max(1, Math.ceil(num(q.l)/num(x.entPort,6)));
      const pieces = num(q.nbLignesPannes)*tr + num(q.nbLignesLisses)*2*tr + (x.type==="ossature"||x.type==="oss_couv" ? 0 : lissesPignon) + 2*num(x.potelets) + (tr>0 ? 16 : 0) + hv*6;
      return mk("bat", {portiques:n, pieces:Math.round(pieces), assemb: 5 + (num(x.potelets)?1:0) + hv + ouvT});
    }
    case "auvent": return mk("auv", {poteaux:num(q.nbPoteaux), pieces:Math.round(n + num(q.nbLignesPannes)*tr), assemb:3});
    case "mezz": return mk("mezz", {pieces:Math.round(num(q.emprise)/3) + 4, assemb:3});
    case "gc": return mk("gc", {ml:num(q.gcL)});
    case "escalier": return mk("esc", {});
    case "portail": return mk("port", {portails:num(q.nbPortails), portillons:num(q.nbPortillons), cloture:num(q.clotL)});
    case "metal": { const t = x.tubes||[]; return mk("serr", {pieces: t.reduce((a,v) => a + (num(v.pieces)||1), 0), assemb: Math.ceil(t.length/2)}); }
    case "couv": case "bard": case "froid": case "soustraite": return null; // pas de plans d'acier à dessiner
    default: return mk("serr", {});
  }
}
function importEndgo(f, auto){
  if(!f || f.format !== "endgo-dessin" || !Array.isArray(f.ouvrages)) throw new Error("format");
  const ouvrages = f.ouvrages.map(ouvFromEndgo).filter(Boolean);
  const ignores = f.ouvrages.filter(x => !ouvFromEndgo(x)).map(x => x.name + " (" + x.typeLabel + ")");
  const endgo = {id:f.id, num:f.num, envoye:f.envoye, titre:f.titre, client:f.client, kg:f.kg,
    ouvrages:f.ouvrages.map(x => ({name:x.name, typeLabel:x.typeLabel, variant:x.variant, dim:x.dim, kg:x.kg, profils:(x.profils||[]).filter(p => p.ref), schema:x.schema||""})), ignores};
  let p = DB.projets.find(x => x.endgo && x.endgo.id === f.id); const neuf = !p;
  if(p){ p.ouvrages = ouvrages.length ? ouvrages : p.ouvrages; p.endgo = endgo; }
  else {
    p = {id:uid(), nom:(f.titre ? f.titre + " · " : "") + f.num, client:"romain", clientNom:"Romain" + (f.client && f.client.nom ? " · " + f.client.nom : ""), date:today(), statut:0, cx:3,
         phases:{ens:true,fab:true,nom:true,mont:true}, ouvrages: ouvrages.length ? ouvrages : [{id:uid(), type:"serr", q:{}, kg:""}],
         docs:{}, notes:"", chrono:{}, run:null, revisions:[], endgo};
    DB.projets.unshift(p);
  }
  p.docs.v3d = endgo.ouvrages.some(o => o.schema); p.docs.poids = num(f.kg) > 0; p.docs.ndc = endgo.ouvrages.some(o => o.profils.length);
  if(auto){ if(neuf && !p.mode) p.mode = "heures"; return neuf; }
  DB.cur = p.id; go("projet");
}

/* ================= Chrono ================= */
let tick = null;
function stopRun(p){ if(p.run){ p.chrono = p.chrono||{}; p.chrono[p.run.phase] = num(p.chrono[p.run.phase]) + (Date.now()-p.run.start)/1000; p.run = null; } }
function vChrono(){
  clearInterval(tick);
  const p = cur(), c = calc(p);
  const fT = s => { s = Math.floor(s); return `${Math.floor(s/3600)} h ${String(Math.floor(s%3600/60)).padStart(2,"0")}`; };
  const ecart = c.hEst > 0 ? (c.hReel - c.hEst) / c.hEst * 100 : 0;
  main.innerHTML = `
  <div class="card"><h2>${esc(p.nom||"Projet sans nom")}</h2>
    <div class="big-clock" id="clk">${p.run ? fT((Date.now()-p.run.start)/1000) : "—"}</div>
    <p class="muted small" style="margin:4px 0 0">${p.run ? "En cours : "+PHASES.find(x=>x[0]===p.run.phase)[1] : "Touche une phase pour lancer le chrono."}</p>
  </div>
  <div class="card"><h2>Phases</h2>
    ${PHASES.map(([k,l]) => { const s = num((p.chrono||{})[k]) + (p.run&&p.run.phase===k?(Date.now()-p.run.start)/1000:0);
      return `<div class="phase"><span>${l}</span><span class="t">${fT(s)}</span>
      <button type="button" class="btn sm ${p.run&&p.run.phase===k?"run":""}" data-run="${k}">${p.run&&p.run.phase===k?"Stop":"Go"}</button></div>`; }).join("")}
    <div class="row" style="margin-top:10px"><label class="f" style="flex:1"><span>Corriger une phase (heures)</span>
      <div class="row"><select id="fixPh" style="flex:1">${PHASES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select><input id="fixH" inputmode="decimal" style="width:90px" placeholder="h"><button class="btn sm" type="button" id="fixOk">OK</button></div></label></div>
  </div>
  <div class="card"><h2>Estimé et réel</h2><div class="res">
    <div class="kpi"><span class="l">Estimé</span><span class="v">${fH(c.hEst)}</span></div>
    <div class="kpi"><span class="l">Réel</span><span class="v">${fH(c.hReel)}</span><span class="s ${Math.abs(ecart)<=10?"okc":ecart>0?"bad":"warn"}">${c.hEst>0&&c.hReel>=0.05?(ecart>0?"+":"")+fN(ecart,0)+" %":""}</span></div>
    <div class="kpi"><span class="l">€/h réel</span><span class="v">${c.hReel>0.05?fN(c.prix/c.hReel,0)+" €/h":"—"}</span><span class="s">prix retenu ÷ heures réelles</span></div>
    <div class="kpi"><span class="l">h/t réel</span><span class="v">${c.kg>0&&c.hReel>=0.05?fN(c.hReel/(c.kg/1000),2):"—"}</span><span class="s">pour caler ton €/tonne</span></div>
  </div></div>
  <div class="card"><h2>Révisions (facturées ${fN(c.taux,0)} €/h)</h2>
    ${(p.revisions||[]).map((r,i)=>`<div class="phase"><span>${esc(r.date)} · ${esc(r.note||"Révision")}</span><span class="t">${fH(num(r.h))}</span><button class="btn sm ghost danger" type="button" data-delr="${i}" aria-label="Retirer">✕</button></div>`).join("") || `<p class="muted small" style="margin:0">Aucune révision.</p>`}
    <div class="grid" style="margin-top:10px"><label class="f"><span>Heures</span><input id="r_h" inputmode="decimal"></label><label class="f"><span>Motif</span><input id="r_n" placeholder="Indice B : déplacement poteau"></label></div>
    <div class="row" style="margin-top:8px"><button class="btn sm primary" type="button" id="r_add">Ajouter la révision</button></div>
  </div>`;
  main.querySelectorAll("[data-run]").forEach(b => b.onclick = () => {
    const k = b.dataset.run, was = p.run && p.run.phase === k;
    DB.projets.forEach(stopRun);
    if(!was){ p.run = {phase:k, start:Date.now()}; if(p.statut < 2) p.statut = 2; }

  });
  main.querySelector("#fixOk").onclick = () => { const v = main.querySelector("#fixH").value; if(v==="") return; stopRun(p); p.chrono = p.chrono||{}; p.chrono[main.querySelector("#fixPh").value] = num(v)*3600; save(); vChrono(); };
  main.querySelector("#r_add").onclick = () => { const h = num(main.querySelector("#r_h").value); if(!h) return; (p.revisions = p.revisions||[]).push({date:today(), h, note:main.querySelector("#r_n").value}); save(); vChrono(); };
  main.querySelectorAll("[data-delr]").forEach(b => b.onclick = () => { p.revisions.splice(+b.dataset.delr,1); save(); vChrono(); });
  if(p.run) tick = setInterval(() => { if(DB.tab!=="chrono"){ clearInterval(tick); return; } const el = document.getElementById("clk"); if(el) el.textContent = fT((Date.now()-p.run.start)/1000); }, 1000);

/* ================= Liaison automatique avec Devis ENDGO =================
   Même script Google qu'ENDGO (adresse /exec + clé). ENDGO y dépose les chantiers envoyés
   (bouton « Envoyer à D-Riv 3D ») ; D-Riv les relève tout seul et renvoie son prix à chaque changement. */
const LIEN_KEY = "driv3d_liaison";
let LIEN = {url:"", key:"", depuis:"", envoyes:{}, at:"", err:""};
try{ LIEN = Object.assign(LIEN, JSON.parse(localStorage.getItem(LIEN_KEY) || "{}")); }catch(e){}
function lienStore(){ try{ localStorage.setItem(LIEN_KEY, JSON.stringify(LIEN)); }catch(e){} }
const lienOn = () => !!(LIEN.url && LIEN.key);
function lienCall(payload){
  payload.key = LIEN.key;
  return fetch(LIEN.url, {method:"POST", body:JSON.stringify(payload)}).then(r => r.json());
}
function lienMsg(t){ const s = document.getElementById("saveState"); if(s) s.textContent = t; }
let lienBusy = false, lienTimer = null;
async function lienRelever(manuel){
  if(!lienOn() || lienBusy) return;
  if(!navigator.onLine){ if(manuel) lienMsg("Hors ligne"); return; }
  lienBusy = true;
  try{
    const r = await lienCall({action:"drivLire", fiches:true, depuis:LIEN.depuis || ""});
    if(!r || !r.ok) throw new Error(r && r.err === "action inconnue" ? "script Google pas à jour" : (r && r.err) || "réponse inattendue");
    const fiches = (r.fiches || []).sort((a, b) => String(a.envoye).localeCompare(String(b.envoye)));
    let nouveaux = 0, maj = 0;
    fiches.forEach(f => { try{ const neuf = importEndgo(f, true); if(neuf) nouveaux++; else maj++; }catch(e){}
      if(String(f.envoye) > String(LIEN.depuis || "")) LIEN.depuis = f.envoye; });
    LIEN.at = new Date().toISOString(); LIEN.err = ""; lienStore();
    if(fiches.length){ save(); render(); lienMsg(nouveaux ? nouveaux + " chantier" + (nouveaux > 1 ? "s" : "") + " ENDGO reçu" + (nouveaux > 1 ? "s" : "") : "Chantier ENDGO mis à jour"); }
    else if(manuel) lienMsg("ENDGO : rien de nouveau");
    lienPrixPlanifier(0);
  }catch(e){ LIEN.err = e.message; lienStore(); if(manuel) lienMsg("Liaison ENDGO : " + e.message); }
  finally{ lienBusy = false; }
}
/* Prix renvoyé à ENDGO dès qu'il change (prix affiché du projet : à l'heure ou à la tonne + révisions). */
function lienPrixListe(){
  const out = {};
  DB.projets.forEach(p => { if(!p.endgo || !p.endgo.id) return; const c = calc(p);
    const v = {ht:Math.round(c.total * 100) / 100, mode:c.mode === "tonne" && c.kg > 0 ? "tonne" : "heures", h:Math.round(c.hEst * 10) / 10, kg:Math.round(c.kg), statut:STATUTS[p.statut] || ""};
    const sig = JSON.stringify(v);
    if(LIEN.envoyes[p.endgo.id] !== sig) out[p.endgo.id] = Object.assign(v, {maj:new Date().toISOString(), sig}); });
  return out;
}
function lienPrixPlanifier(ms){
  if(!lienOn()) return;
  clearTimeout(lienTimer); lienTimer = setTimeout(lienPrixEnvoyer, ms == null ? 3000 : ms);
}
async function lienPrixEnvoyer(){
  if(!lienOn() || !navigator.onLine) return;
  const l = lienPrixListe(), ids = Object.keys(l); if(!ids.length) return;
  const prix = {}; ids.forEach(k => { const {sig, ...v} = l[k]; prix[k] = v; });
  try{
    const r = await lienCall({action:"drivPrix", prix});
    if(!r || !r.ok) throw new Error((r && r.err) || "réponse inattendue");
    ids.forEach(k => LIEN.envoyes[k] = l[k].sig); LIEN.err = ""; lienStore();
    lienMsg("Prix envoyé à ENDGO");
  }catch(e){ LIEN.err = e.message; lienStore(); }
}
function lienCard(){

    <p class="muted small" style="margin:0 0 10px">Recopie l'adresse du script et la clé affichées dans ENDGO (menu ☰ › Synchronisation Google). Les chantiers envoyés depuis ENDGO arrivent tout seuls dans Projets, et ton prix des plans repart vers le devis ENDGO à chaque changement.</p>
    <div class="grid"><label class="f"><span>Adresse du script (se termine par /exec)</span><input id="l_url" value="${esc(LIEN.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>

/* ================= Synchro de MES projets (PC ↔ téléphone) =================
   Script Google sur le compte de Donatien (fichier script-google-driv3d.gs), distinct du script ENDGO.
   Fusion projet par projet : ce qui a changé d'un seul côté gagne ; si les deux ont changé, l'appareil qui synchronise garde sa version. */
const MS_KEY = "driv3d_sync";
let MS = {url:"", key:"", version:"", base:{p:{}, s:""}, at:"", err:""};
try{ MS = Object.assign(MS, JSON.parse(localStorage.getItem(MS_KEY) || "{}")); }catch(e){}
MS.base = MS.base || {p:{}, s:""};
function msStore(){ try{ localStorage.setItem(MS_KEY, JSON.stringify(MS)); }catch(e){} }
const msOn = () => !!(MS.url && MS.key);
function msCall(payload){ payload.key = MS.key; return fetch(MS.url, {method:"POST", body:JSON.stringify(payload)}).then(r => r.json()); }
const msH = o => JSON.stringify(o === undefined ? null : o);
function msLocalChanged(){
  if(msH(DB.settings) !== MS.base.s) return true;
  const ids = Object.keys(MS.base.p); if(ids.length !== DB.projets.length) return true;
  return DB.projets.some(p => MS.base.p[p.id] !== msH(p));
}
function msReplace(obj, src){ Object.keys(obj).forEach(k => delete obj[k]); Object.assign(obj, JSON.parse(JSON.stringify(src))); }
/* Fusionne les données distantes R dans DB. Renvoie true si DB a changé. */
function msMerge(R){
  const B = MS.base.p, L = {}, Rm = {}; let chg = false;
  DB.projets.forEach(p => L[p.id] = p); (R.projets || []).forEach(p => Rm[p.id] = p);
  const out = [];
  DB.projets.forEach(p => { const r = Rm[p.id], b = B[p.id], lc = msH(p) !== b;
    if(!r){ if(b !== undefined && !lc){ chg = true; return; } out.push(p); return; }     // effacé ailleurs (et pas modifié ici) ou nouveau ici
    const rc = msH(r) !== b;
    if(rc && !lc){ msReplace(p, r); chg = true; }
    out.push(p); });
  const neufs = (R.projets || []).filter(r => !L[r.id] && !(B[r.id] !== undefined && msH(r) === B[r.id]));  // pas effacé ici sans changement là-bas
  if(neufs.length){ chg = true;
    // même chantier ENDGO reçu sur les deux appareils : on garde la copie déjà synchronisée de l'autre appareil
    neufs.forEach(r => { if(!r.endgo || !r.endgo.id) return; const i = out.findIndex(p => p.endgo && p.endgo.id === r.endgo.id && B[p.id] === undefined);
      if(i >= 0){ if(DB.cur === out[i].id) DB.cur = r.id; out.splice(i, 1); } });
    out.unshift(...neufs.map(r => JSON.parse(JSON.stringify(r)))); }
  if(chg) DB.projets = out;
  if(R.settings && msH(R.settings) !== MS.base.s && msH(DB.settings) === MS.base.s){ msReplace(DB.settings, R.settings); chg = true; }
  return chg;
}
function msSetBase(){ MS.base = {p:{}, s:msH(DB.settings)}; DB.projets.forEach(p => MS.base.p[p.id] = msH(p)); }
let msBusy = false, msTimer = null;
async function msSync(manuel){
  if(!msOn() || msBusy) return;
  if(!navigator.onLine){ if(manuel) lienMsg("Hors ligne"); return; }
  msBusy = true;
  try{
    for(let essai = 0; essai < 3; essai++){
      const info = await msCall({action:"info"});
      if(!info || !info.ok) throw new Error((info && info.err) || "script injoignable");
      const distant = (info.version || "") !== (MS.version || ""), local = msLocalChanged();
      let chg = false, version = info.version || "";
      if(distant){
        const r = await msCall({action:"pull"}); if(!r || !r.ok) throw new Error((r && r.err) || "lecture impossible");
        version = r.version || "";
        let R = null; try{ R = r.data ? JSON.parse(r.data) : null; }catch(e){}
        if(R) chg = msMerge(R);
      }
      if(chg){ save(); const a = document.activeElement; if(!a || !/INPUT|TEXTAREA|SELECT/.test(a.tagName)) render(); }
      const envoyer = local || (distant && !version) || (!version && DB.projets.length);
      if(envoyer || (distant && msLocalChanged())){
        const p = await msCall({action:"push", base:version, data:JSON.stringify({v:1, projets:DB.projets, settings:DB.settings})});
        if(p && p.conflict){ MS.version = ""; continue; }      // quelqu'un a écrit entre-temps : on recommence
        if(!p || !p.ok) throw new Error((p && p.err) || "envoi impossible");
        version = p.version;
      }
      MS.version = version; msSetBase(); MS.at = new Date().toISOString(); MS.err = ""; msStore();
      if(manuel || chg) lienMsg(chg ? "Projets mis à jour depuis l'autre appareil" : "Projets synchronisés");
      break;
    }
  }catch(e){ MS.err = e.message; msStore(); if(manuel) lienMsg("Synchro : " + e.message); }
  finally{ msBusy = false; }
}
function msPlanifier(){ if(!msOn()) return; clearTimeout(msTimer); msTimer = setTimeout(() => msSync(false), 4000); }
function msCard(){
  return `<div class="card"><h2>Synchro de mes projets</h2>
    <p class="muted small" style="margin:0 0 10px">Tes projets sur TON Google Drive (dossier « D-Riv 3D Metallerie »), pareils sur le PC et le téléphone. Script à part de celui d'ENDGO : mets ici l'adresse et la clé de ton script D-Riv 3D, les mêmes sur chaque appareil.</p>
    <div class="grid"><label class="f"><span>Adresse du script (se termine par /exec)</span><input id="m_url" value="${esc(MS.url)}" placeholder="https://script.google.com/macros/s/…/exec"></label>
    <label class="f"><span>Clé</span><input id="m_key" value="${esc(MS.key)}"></label></div>
    <div class="row" style="margin-top:10px"><button class="btn" type="button" id="m_go">Synchroniser maintenant</button></div>
    <p class="muted small" id="m_st" style="margin:8px 0 0">${!msOn() ? "Pas encore réglée : tes projets restent sur cet appareil." : MS.err ? "Dernier essai en échec : " + esc(MS.err) : MS.at ? "Dernière synchro : " + new Date(MS.at).toLocaleString("fr-FR") : "Réglée, pas encore synchronisée."}</p></div>`;
}
function msBind(){
  const u = main.querySelector("#m_url"), k = main.querySelector("#m_key"); if(!u) return;
  const lire = () => { const nu = u.value.trim(), nk = k.value.trim(); if(nu !== MS.url || nk !== MS.key){ MS.url = nu; MS.key = nk; MS.version = ""; MS.base = {p:{}, s:""}; MS.err = ""; msStore(); } };
  u.onchange = lire; k.onchange = lire;
  main.querySelector("#m_go").onclick = async () => { lire(); const st = main.querySelector("#m_st");
    if(!msOn()){ st.textContent = "Indique l'adresse et la clé."; return; }
    st.textContent = "Synchro en cours…"; await msSync(true);
    const s2 = main.querySelector("#m_st"); if(s2) s2.textContent = MS.err ? "Échec : " + MS.err : "OK, synchronisé le " + new Date(MS.at).toLocaleString("fr-FR"); };
}

  </div>
  <div class="card"><h2>Temps de modélisation par ouvrage</h2>
    <p class="muted small" style="margin:0 0 4px">Heures pour la modélisation 3D + plans d'ensemble, complexité « Normal ». Touche un ouvrage pour régler ses temps.</p>
    ${Object.keys(TYPES).map(k => { const t = T(k), mod = types[k] && Object.keys(types[k]).length; return `<details class="sdet" data-det="${k}">
      <summary>${t.label}${mod ? ` <small>· modifié</small>` : ""}</summary><div class="in">
      ${row("Mise en route du projet", "Temps fixe, quelle que soit la taille.", `data-t="${k}" data-k="base"`, t.base, "h")}
      ${t.prem !== null ? row(t.premLab, "Dessiné en entier.", `data-t="${k}" data-k="prem"`, t.prem, "h") : ""}
      ${t.f.map(([fk,l,u,h],i) => row(i===0 && t.prem!==null ? t.copieLab : "Par " + (u === "u" ? "unité" : u) + " : " + esc(l.toLowerCase()), "", `data-t="${k}" data-h="${fk}"`, h, "h/" + u)).join("")}
      ${row("Prix à la tonne", "Utilisé quand tu choisis « Prix à la tonne ».", `data-t="${k}" data-k="eurT"`, t.eurT, "€/t")}
      ${k === "bat" ? `<p class="hint" id="exBat" style="margin:8px 0 0">${exBat()}</p>` : ""}
      ${mod ? `<button class="btn sm ghost" type="button" data-reset="${k}" style="margin-top:8px">Remettre les valeurs d'origine</button>` : ""}
    </div></details>`; }).join("")}
  </div>
  <div class="card"><details class="sdet"><summary>Coefficients de complexité (boutons 1 à 5)</summary><div class="in">
    ${cx.map((v,i) => row((i+1) + " · " + CX_LABELS[i], "", `data-cxv="${i}"`, v, "× heures")).join("")}
  </div></details></div>
  <p class="muted small" style="text-align:center;margin:0">Synchro, liaison ENDGO et sauvegarde : menu ☰ en haut.</p>`;
  const on = (sel, fn) => main.querySelectorAll(sel).forEach(i => i.onchange = () => { fn(i); save(); const e = main.querySelector("#exBat"); if(e) e.innerHTML = exBat(); });
  on("#s_taux", i => st.taux = num(i.value, SET_DEF.taux));
  on("#s_coef", i => st.coefPlans = num(i.value, SET_DEF.coefPlans));
  on("[data-cxv]", i => { const a = S("cx").slice(); a[+i.dataset.cxv] = num(i.value, 1); st.cx = a; });
  on("[data-t]", i => { const o = types[i.dataset.t] = types[i.dataset.t] || {}; if(i.dataset.h){ o.h = o.h || {}; o.h[i.dataset.h] = num(i.value); } else o[i.dataset.k] = num(i.value); });
  main.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { delete types[b.dataset.reset]; save(); vReglages(); const d = main.querySelector(`[data-det="${b.dataset.reset}"]`); if(d) d.open = true; });
}
/* Menu ☰ : réglages qu'on ne touche qu'une fois (synchro, liaison ENDGO, sauvegarde). */
function vMenu(){
  main.innerHTML = `
  <button class="btn ghost" type="button" id="back" style="align-self:flex-start">‹ Retour</button>
  ${msCard()}
  ${lienCard()}
  <div class="card"><h2>Sauvegarde</h2>
    <p class="muted small" style="margin:0 0 10px">Une copie de tous tes projets, au cas où.</p>
    <div class="row"><button class="btn" type="button" id="exp">Copier la sauvegarde</button><label class="btn" style="cursor:pointer">Importer un fichier<input type="file" id="imp" accept=".json,application/json" hidden></label><button class="btn" type="button" id="paste">Coller une sauvegarde</button></div>
    <textarea id="bk" rows="4" hidden aria-label="Sauvegarde"></textarea>
  </div>`;
  main.querySelector("#back").onclick = () => go(DB.prevTab && DB.prevTab !== "menu" ? DB.prevTab : "projets");
  lienBind(); msBind();
  const bk = main.querySelector("#bk");
  main.querySelector("#exp").onclick = function(){ bk.hidden = false; bk.value = JSON.stringify({app:"driv3d-metallerie", ...DB}); copy(bk.value, this); };
  main.querySelector("#paste").onclick = function(){ if(bk.hidden){ bk.hidden = false; bk.value = ""; bk.placeholder = "Colle ici le texte de la sauvegarde, puis touche encore le bouton"; bk.focus(); return; } restore(bk.value, this); };
  main.querySelector("#imp").onchange = e => { const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = () => restore(r.result, main.querySelector("#exp")); r.readAsText(f); };
}
document.getElementById("menuBtn").onclick = () => { if(DB.tab === "menu") return; DB.prevTab = DB.tab; go("menu"); };
function restore(txt, btn){
  try{ const d = JSON.parse(txt); if(!d || !Array.isArray(d.projets)) throw 0; DB = Object.assign({v:1, projets:[], settings:{}}, d); delete DB.app; save(); btn.textContent = "Sauvegarde chargée"; setTimeout(render, 600); }
  catch(e){ btn.textContent = "Texte non reconnu"; }
}
function copy(t, btn){
  const old = btn.textContent;
  const done = ok => { btn.textContent = ok ? "Copié" : "Sélectionne et copie"; setTimeout(() => btn.textContent = old, 1500); };
  try{ navigator.clipboard.writeText(t).then(() => done(true), () => done(false)); }catch(e){ done(false); }
}

/* ================= Thème ================= */
function applyTheme(){ let t = "dark"; try{ t = localStorage.getItem(THEME_KEY) || "dark"; }catch(e){} document.documentElement.dataset.theme = t; }
document.getElementById("themeBtn").onclick = () => { const l = document.documentElement.dataset.theme === "light"; try{ localStorage.setItem(THEME_KEY, l ? "dark" : "light"); }catch(e){} applyTheme(); };
applyTheme();
render();
async function toutSync(){ await msSync(false); await lienRelever(false); }
setTimeout(toutSync, 1500);
setInterval(() => { if(!document.hidden) toutSync(); }, 120000);
document.addEventListener("visibilitychange", () => { if(!document.hidden) toutSync(); else if(msOn() && msLocalChanged()){ clearTimeout(msTimer); msSync(false); } });
window.addEventListener("online", toutSync);
if("serviceWorker" in navigator && location.protocol === "https:" && !/claude/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
